                      data: {$ref: "#/components/schemas/AgentMessageResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/ValidationError"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/agent/sessions/{session_id}/contents/{content_ref}/confirmation:
    post:
      tags: [Agent]
      operationId: confirmAgentContent
      summary: 确认或拒绝候选核验正文
      description: 只有 confirmed 且属于当前会话的 content_ref 才能核验；确认后正文、类型和 span 不可变。
      security: [{agentSessionToken: []}, {bearerAuth: []}]
      parameters:
        - {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: content_ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContentConfirmation"}
      responses:
        "200": {$ref: "#/components/schemas/AgentContentResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/agent/runs/{run_id}:
    get:
      tags: [Agent]
      operationId: getAgentRun
      summary: 读取运行状态、工具审计摘要和降级
      security: [{agentSessionToken: []}, {bearerAuth: []}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/schemas/AgentRunResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 运营接口需要 role=operator。
    traceToken:
      type: apiKey
      in: header
      name: X-Trace-Token
      description: 单条核验或对应批量条目返回的匿名轨迹凭据；仅授权一个 trace_id。
    batchToken:
      type: apiKey
      in: header
      name: X-Batch-Token
      description: 批量响应或 504 details 返回的匿名批量凭据。
    agentSessionToken:
      type: apiKey
      in: header
      name: X-Agent-Session-Token
      description: 匿名消息会话凭据，不写入 URL。
  parameters:
    TraceId: {name: trace_id, in: path, required: true, schema: {type: string, format: uuid}}
    BatchId: {name: batch_id, in: path, required: true, schema: {type: string, format: uuid}}
    RuleId: {name: rule_id, in: path, required: true, schema: {type: string, pattern: "^R[0-9]+$", maxLength: 64}}
    CaseId: {name: case_id, in: path, required: true, schema: {type: string, pattern: "^C[0-9]+$", maxLength: 32}}
    Version: {name: version, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  requestBodies:
    VerificationRequest:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/VerificationRequest"}
          example: {content_type: sms, content: "【快递】您的包裹异常，请立即联系 400-000-0000", mode: fast}
    CaseRequest:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CaseInput"}
    RuleDefinition:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RuleDefinition"}
    RevisionRequest:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RevisionRequest"}
    ActivationRequest:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ActivationRequest"}
  responses:
    DataSuccess:
      description: 操作成功；data 为对应资源或分页对象
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiSuccess"}
    BadRequest:
      description: 业务输入不合法
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Unauthorized:
      description: 未认证、凭据失效或与资源不匹配
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Forbidden:
      description: 角色或资源所有权不允许
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    NotFound:
      description: 资源不存在，或不暴露无权资源的存在
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Conflict:
      description: revision、active 版本、不可变状态或阻断冲突
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ValidationError:
      description: 请求格式、字段、枚举或条目数量校验失败
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    PayloadTooLarge:
      description: 上传文件超过 2MB
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Timeout:
      description: 同步 deadline 到期；若已创建资源，details 包含真实查询 ID 和相应匿名凭据，不宣称完成
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
  schemas:
    ContentType: {type: string, enum: [sms, chat, url, phone]}
    VerifyMode: {type: string, enum: [fast, enhanced], default: fast}
    RiskLevel: {type: string, enum: [安全, 低风险, 中风险, 高风险]}
    Uuid: {type: string, format: uuid}
    DateTime: {type: string, format: date-time}
    Version: {type: string, minLength: 1, maxLength: 64}
    DegradedItem:
      type: object
      additionalProperties: false
      required: [component, code, message]
      properties:
        component: {type: string, enum: [llm, retriever, agent, replay, storage]}
        code: {type: string, minLength: 1, maxLength: 64}
        message: {type: string, minLength: 1, maxLength: 500}
    DegradedList:
      type: array
      items: {$ref: "#/components/schemas/DegradedItem"}
      default: []
    ApiSuccess:
      type: object
      additionalProperties: false
      required: [code, data, degraded, trace_id]
      properties:
        code: {type: string, example: OK}
        data: {}
        degraded: {$ref: "#/components/schemas/DegradedList"}
        trace_id: {type: [string, "null"], format: uuid}
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, degraded, trace_id]
      properties:
        code: {type: string, example: VALIDATION_ERROR}
        message: {type: string, minLength: 1}
        details:
          type: object
          description: 字段错误或部分完成资源信息；不含 SQL、堆栈和密钥。
          additionalProperties: true
        degraded: {$ref: "#/components/schemas/DegradedList"}
        trace_id: {type: [string, "null"], format: uuid}
    BatchTimeoutError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            details:
              type: object
              additionalProperties: false
              required: [batch_id, batch_token]
              properties:
                batch_id: {type: string, format: uuid}
                batch_token: {type: string, minLength: 32}
    TokenResult:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, role]
      properties:
        access_token: {type: string, minLength: 20}
        token_type: {type: string, const: bearer}
        expires_in: {type: integer, minimum: 1}
        role: {type: string, enum: [user, operator]}
    VerificationRequest:
      type: object
      additionalProperties: false
      required: [content_type, content]
      properties:
        content_type: {$ref: "#/components/schemas/ContentType"}
        content: {type: string, minLength: 1, maxLength: 100000}
        mode: {$ref: "#/components/schemas/VerifyMode"}
    EvidenceSpan:
      type: object
      additionalProperties: false
      required: [text, start, end]
      properties:
        text: {type: string, minLength: 1}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 1}
      description: 服务端必须校验 text == original[start:end]。
    RuleHit:
      type: object
      additionalProperties: false
      required: [rule_id, rule_version, matched, participates_in_score, suppressed_by, weight, evidence, hit_order]
      properties:
        rule_id: {type: string, pattern: "^R[0-9]+$"}
        rule_version: {type: string, format: uuid}
        matched: {type: boolean}
        participates_in_score: {type: boolean}
        suppressed_by: {type: [string, "null"]}
        weight: {type: integer, minimum: 0, maximum: 100}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/EvidenceSpan"}
        hit_order: {type: integer, minimum: 0}
    ScoreDetail:
      type: object
      additionalProperties: false
      required: [rule_score, semantic_raw, semantic_coefficient, semantic_score, total_score, selected_segments, selected_features]
      properties:
        rule_score: {type: number, minimum: 0, maximum: 100, description: min(100, 参与评分命中权重之和)}
        semantic_raw: {type: number, minimum: 0, maximum: 100}
        semantic_coefficient: {type: number, minimum: 0, maximum: 1}
        semantic_score: {type: number, minimum: 0, maximum: 100}
        total_score: {type: number, minimum: 0, maximum: 100}
        selected_segments:
          type: array
          items: {type: integer, minimum: 0}
          description: 最终选中窗口在 segment_results 中的索引。
        selected_features:
          type: array
          items: {type: string}
      description: semantic_score=semantic_coefficient×semantic_raw；无任何命中时 semantic_score 和 total_score 均为 0。
    SegmentResult:
      type: object
      additionalProperties: false
      required: [index, global_start, global_end, fraud_intent, speech_features, raw_output]
      properties:
        index: {type: integer, minimum: 0}
        global_start: {type: integer, minimum: 0}
        global_end: {type: integer, minimum: 1}
        fraud_intent: {type: string}
        speech_features: {type: array, items: {type: string}}
        raw_output: {type: object}
    ConfigVersions:
      type: object
      additionalProperties: false
      required: [rule_version, rule_release_id, threshold_version, semantic_config_version, transform_dict_version, list_version, retriever_version]
      properties:
        rule_version: {$ref: "#/components/schemas/Version"}
        rule_release_id: {type: string, format: uuid}
        threshold_version: {$ref: "#/components/schemas/Version"}
        semantic_config_version: {$ref: "#/components/schemas/Version"}
        transform_dict_version: {$ref: "#/components/schemas/Version"}
        list_version: {$ref: "#/components/schemas/Version"}
        retriever_version: {type: [string, "null"], maxLength: 64}
    VerificationResult:
      type: object
      additionalProperties: false
      required: [trace_id, trace_token, content_type, mode, fraud_type, total_score, risk_level, rule_score, semantic_score, hits, explanation, degraded, versions, created_at]
      properties:
        trace_id: {type: string, format: uuid}
        trace_token: {type: string, minLength: 32}
        content_type: {$ref: "#/components/schemas/ContentType"}
        mode: {$ref: "#/components/schemas/VerifyMode"}
        fraud_type: {type: string}
        total_score: {type: number, minimum: 0, maximum: 100}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        rule_score: {type: number, minimum: 0, maximum: 100}
        semantic_score: {type: number, minimum: 0, maximum: 100}
        hits: {type: array, items: {$ref: "#/components/schemas/RuleHit"}}
        explanation: {type: string}
        degraded: {$ref: "#/components/schemas/DegradedList"}
        versions: {$ref: "#/components/schemas/ConfigVersions"}
        created_at: {$ref: "#/components/schemas/DateTime"}
    VerificationResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccess"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/VerificationResult"}
    JudgmentTrace:
      type: object
      additionalProperties: false
      required: [trace_id, content_type, verify_mode, original_text, normalized_text, facts, segment_results, hits, score_detail, similar_cases, degraded, llm_raw_output, fraud_type, total_score, risk_level, versions, model_provider, model_name, stage_timings_ms, created_at]
      properties:
        trace_id: {type: string, format: uuid}
        content_type: {$ref: "#/components/schemas/ContentType"}
        verify_mode: {$ref: "#/components/schemas/VerifyMode"}
        original_text: {type: string}
        normalized_text: {type: string}
        facts: {type: object}
        segment_results: {type: array, items: {$ref: "#/components/schemas/SegmentResult"}}
        hits: {type: array, items: {$ref: "#/components/schemas/RuleHit"}}
        score_detail: {$ref: "#/components/schemas/ScoreDetail"}
        similar_cases:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [case_id, similarity]
            properties:
              case_id: {type: string, pattern: "^C[0-9]+$"}
              similarity: {type: number, minimum: -1, maximum: 1}
        degraded: {$ref: "#/components/schemas/DegradedList"}
        llm_raw_output: {type: [object, "null"]}
        fraud_type: {type: string}
        total_score: {type: number, minimum: 0, maximum: 100}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        versions: {$ref: "#/components/schemas/ConfigVersions"}
        model_provider: {type: [string, "null"]}
        model_name: {type: [string, "null"]}
        stage_timings_ms: {type: object, additionalProperties: {type: number, minimum: 0}}
        created_at: {$ref: "#/components/schemas/DateTime"}
    BatchItemResult:
      type: object
      additionalProperties: false
      required: [item_no, content_type, status, trace_id, trace_token, risk_level, total_score, error_code]
      properties:
        item_no: {type: integer, minimum: 1}
        content_type: {$ref: "#/components/schemas/ContentType"}
        status: {type: string, enum: [succeeded, degraded, failed]}
        trace_id: {type: [string, "null"], format: uuid}
        trace_token: {type: [string, "null"], minLength: 32}
        risk_level: {type: [string, "null"], enum: [安全, 低风险, 中风险, 高风险, null]}
        total_score: {type: [number, "null"], minimum: 0, maximum: 100}
        error_code: {type: [string, "null"]}
      allOf:
        - if:
            properties: {status: {const: failed}}
          then:
            properties:
              trace_id: {type: "null"}
              trace_token: {type: "null"}
              risk_level: {type: "null"}
              total_score: {type: "null"}
              error_code: {type: string, minLength: 1}
          else:
            properties:
              trace_id: {type: string, format: uuid}
              trace_token: {type: string, minLength: 32}
              risk_level: {$ref: "#/components/schemas/RiskLevel"}
              total_score: {type: number, minimum: 0, maximum: 100}
    BatchResult:
      type: object
      additionalProperties: false
      required: [batch_id, batch_token, status, item_count, safe_count, low_count, medium_count, high_count, failed_count, items]
      properties:
        batch_id: {type: string, format: uuid}
        batch_token: {type: string, minLength: 32}
        status: {type: string, enum: [queued, running, completed, completed_with_errors, failed]}
        item_count: {type: integer, minimum: 1, maximum: 1000}
        safe_count: {type: integer, minimum: 0}
        low_count: {type: integer, minimum: 0}
        medium_count: {type: integer, minimum: 0}
        high_count: {type: integer, minimum: 0}
        failed_count: {type: integer, minimum: 0}
        items: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/BatchItemResult"}}
    BatchDetailItem:
      type: object
      additionalProperties: false
      required: [item_no, content_type, status, trace_id, risk_level, total_score, error_code]
      properties:
        item_no: {type: integer, minimum: 1}
        content_type: {$ref: "#/components/schemas/ContentType"}
        status: {type: string, enum: [succeeded, degraded, failed]}
        trace_id: {type: [string, "null"], format: uuid}
        risk_level: {type: [string, "null"], enum: [安全, 低风险, 中风险, 高风险, null]}
        total_score: {type: [number, "null"], minimum: 0, maximum: 100}
        error_code: {type: [string, "null"]}
      allOf:
        - if:
            properties: {status: {const: failed}}
          then:
            properties:
              trace_id: {type: "null"}
              risk_level: {type: "null"}
              total_score: {type: "null"}
              error_code: {type: string, minLength: 1}
          else:
            properties:
              trace_id: {type: string, format: uuid}
              risk_level: {$ref: "#/components/schemas/RiskLevel"}
              total_score: {type: number, minimum: 0, maximum: 100}
    BatchDetail:
      type: object
      additionalProperties: false
      required: [batch_id, status, item_count, safe_count, low_count, medium_count, high_count, failed_count, items]
      properties:
        batch_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, completed, completed_with_errors, failed]}
        item_count: {type: integer, minimum: 1, maximum: 1000}
        safe_count: {type: integer, minimum: 0}
        low_count: {type: integer, minimum: 0}
        medium_count: {type: integer, minimum: 0}
        high_count: {type: integer, minimum: 0}
        failed_count: {type: integer, minimum: 0}
        items: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/BatchDetailItem"}}
    ExplanationRecord:
      type: object
      additionalProperties: false
      required: [explanation_id, trace_id, view, content, source, citation_status, model_provider, model_name, created_at]
      properties:
        explanation_id: {type: string, format: uuid}
        trace_id: {type: string, format: uuid}
        view: {type: string, enum: [user, technical]}
        content: {type: string, minLength: 1}
        source: {type: string, enum: [template, llm]}
        citation_status: {type: string, enum: [not_checked, passed, fallback]}
        model_provider: {type: [string, "null"]}
        model_name: {type: [string, "null"]}
        created_at: {$ref: "#/components/schemas/DateTime"}
    CaseInput:
      type: object
      additionalProperties: false
      required: [fraud_type, title, content, advice, source_url, status]
      properties:
        fraud_type: {type: string, minLength: 1, maxLength: 64}
        title: {type: string, minLength: 1, maxLength: 255}
        content: {type: string, minLength: 1}
        advice: {type: string, minLength: 1}
        source_url: {type: string, format: uri, minLength: 1}
        status: {type: string, enum: [draft, published, archived]}
    CaseUpdate:
      type: object
      additionalProperties: false
      required: [revision, fraud_type, title, content, advice, source_url, status]
      properties:
        revision: {type: integer, minimum: 1}
        fraud_type: {type: string, minLength: 1, maxLength: 64}
        title: {type: string, minLength: 1, maxLength: 255}
        content: {type: string, minLength: 1}
        advice: {type: string, minLength: 1}
        source_url: {type: string, format: uri, minLength: 1}
        status: {type: string, enum: [draft, published, archived]}
    RevisionRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, minimum: 1}
    RuleDefinition:
      type: object
      additionalProperties: false
      required: [fraud_type, weight, conditions, explanation, enabled]
      properties:
        fraud_type: {type: string, minLength: 1, maxLength: 64}
        weight: {type: integer, minimum: 0, maximum: 100}
        exclusive_group: {type: [string, "null"], maxLength: 64}
        priority: {type: integer, default: 0}
        conditions: {type: object, description: 声明式规则 DSL，不接收风险分或阈值覆盖}
        explanation: {type: string, minLength: 1}
        enabled: {type: boolean}
    RuleDraftUpdate:
      type: object
      additionalProperties: false
      required: [revision, fraud_type, weight, conditions, explanation, enabled]
      properties:
        revision: {type: integer, minimum: 1}
        fraud_type: {type: string, minLength: 1, maxLength: 64}
        weight: {type: integer, minimum: 0, maximum: 100}
        exclusive_group: {type: [string, "null"], maxLength: 64}
        priority: {type: integer, default: 0}
        conditions: {type: object, description: 声明式规则 DSL，不接收风险分或阈值覆盖}
        explanation: {type: string, minLength: 1}
        enabled: {type: boolean}
    RuleReleaseItemInput:
      type: object
      additionalProperties: false
      required: [rule_version_id, enabled]
      properties:
        rule_version_id: {type: string, format: uuid}
        enabled: {type: boolean}
    RuleReleaseCreate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/RuleReleaseItemInput"}
      description: items 必须描述完整目标规则集合，而非仅本次改动的规则。
    ActivationRequest:
      type: object
      additionalProperties: false
      required: [expected_active_version]
      properties:
        expected_active_version: {type: [string, "null"], minLength: 1, maxLength: 64}
    ConflictResolution:
      type: object
      additionalProperties: false
      required: [resolution, note]
      properties:
        resolution: {type: string, enum: [fixed, accepted_risk, false_positive]}
        note: {type: string, minLength: 1, maxLength: 2000}
    ListEntryInput:
      type: object
      additionalProperties: false
      required: [entry_type, normalized_value, list_type, source]
      properties:
        entry_type: {type: string, enum: [phone, domain, ip]}
        normalized_value: {type: string, minLength: 1}
        list_type: {type: string, enum: [blacklist, whitelist]}
        source: {type: string, minLength: 1}
    ListDraftUpdate:
      type: object
      additionalProperties: false
      required: [revision, entries]
      properties:
        revision: {type: integer, minimum: 1}
        entries: {type: array, items: {$ref: "#/components/schemas/ListEntryInput"}}
    ThresholdConfigInput:
      type: object
      additionalProperties: false
      required: [low_min, medium_min, high_min]
      properties:
        low_min: {type: number, exclusiveMinimum: 0, maximum: 100}
        medium_min: {type: number, exclusiveMinimum: 0, maximum: 100}
        high_min: {type: number, exclusiveMinimum: 0, maximum: 100}
      description: 服务端强制 low_min < medium_min < high_min。
    SemanticConfigEntryInput:
      type: object
      additionalProperties: false
      required: [fraud_type, feature_key, speech_features, raw_score]
      properties:
        fraud_type: {type: string, minLength: 1, maxLength: 64}
        feature_key: {type: string, minLength: 1}
        speech_features: {type: array, items: {type: string, minLength: 1}}
        raw_score: {type: number, minimum: 0, maximum: 100}
    SemanticConfigInput:
      type: object
      additionalProperties: false
      required: [semantic_coefficient, entries]
      properties:
        semantic_coefficient: {type: number, minimum: 0, maximum: 1}
        entries: {type: array, items: {$ref: "#/components/schemas/SemanticConfigEntryInput"}}
    TransformEntryInput:
      type: object
      additionalProperties: false
      required: [pattern, replacement, match_order, enabled]
      properties:
        pattern: {type: string, minLength: 1}
        replacement: {type: string, minLength: 1}
        match_order: {type: integer, minimum: 0}
        enabled: {type: boolean}
    TransformDictionaryUpdate:
      type: object
      additionalProperties: false
      required: [revision, entries]
      properties:
        revision: {type: integer, minimum: 1}
        entries: {type: array, items: {$ref: "#/components/schemas/TransformEntryInput"}}
    FeedbackCreate:
      type: object
      additionalProperties: false
      required: [trace_id, kind]
      properties:
        trace_id: {type: string, format: uuid}
        kind: {type: string, enum: [false_positive, false_negative]}
        note: {type: string, maxLength: 2000}
    AttackSampleInput:
      type: object
      additionalProperties: false
      required: [sample_key, content_type, content, fraud_type]
      properties:
        sample_key: {type: string, minLength: 1, maxLength: 128}
        content_type: {$ref: "#/components/schemas/ContentType"}
        content: {type: string, minLength: 1}
        fraud_type: {type: string, minLength: 1, maxLength: 64}
        origin_sample_id: {type: [string, "null"], format: uuid}
    SampleSetCreate:
      type: object
      additionalProperties: false
      required: [name, kind, samples]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        kind: {type: string, enum: [original, variant, injection, mixed]}
        origin_set_version: {type: [string, "null"], maxLength: 64}
        samples:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/AttackSampleInput"}
    VariantRequest:
      type: object
      additionalProperties: false
      required: [methods]
      properties:
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [character, semantic, splice]}
        variants_per_sample: {type: integer, minimum: 1, maximum: 20, default: 1}
        seed: {type: integer, minimum: 0, description: 仅控制确定性字符变体，不改变风险判定}
    InjectionRequest:
      type: object
      additionalProperties: false
      required: [injection_types]
      properties:
        injection_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
        injections_per_sample: {type: integer, minimum: 1, maximum: 20, default: 1}
    ExperimentManifest:
      type: object
      additionalProperties: false
      required: [sample_set_version, verify_mode, experiment_mode, rule_version, threshold_version, semantic_config_version, transform_dict_version, list_version, retriever_version, model_provider, model_name, defense_flag]
      properties:
        sample_set_version: {$ref: "#/components/schemas/Version"}
        verify_mode: {$ref: "#/components/schemas/VerifyMode"}
        experiment_mode: {type: string, enum: [pure, hybrid, original, variant, defense_off, defense_on, single]}
        rule_version: {$ref: "#/components/schemas/Version"}
        threshold_version: {$ref: "#/components/schemas/Version"}
        semantic_config_version: {$ref: "#/components/schemas/Version"}
        transform_dict_version: {$ref: "#/components/schemas/Version"}
        list_version: {$ref: "#/components/schemas/Version"}
        retriever_version: {type: [string, "null"], minLength: 1, maxLength: 64}
        model_provider: {type: [string, "null"], minLength: 1, maxLength: 64}
        model_name: {type: [string, "null"], minLength: 1, maxLength: 128}
        defense_flag: {type: boolean}
    ReplayCreate:
      type: object
      additionalProperties: false
      required: [experiment_type, manifest]
      properties:
        experiment_type: {type: string, const: ad_hoc}
        manifest: {$ref: "#/components/schemas/AdHocManifest"}
    AdHocManifest:
      allOf:
        - $ref: "#/components/schemas/ExperimentManifest"
        - type: object
          properties:
            experiment_mode: {const: single}
    ExperimentArmInput:
      type: object
      additionalProperties: false
      required: [arm_role, manifest]
      properties:
        arm_role: {type: string, enum: [pure, hybrid, original, variant, defense_off, defense_on]}
        manifest: {$ref: "#/components/schemas/ExperimentManifest"}
    E3PureArm:
      allOf:
        - $ref: "#/components/schemas/ExperimentArmInput"
        - properties:
            arm_role: {const: pure}
            manifest:
              allOf:
                - $ref: "#/components/schemas/ExperimentManifest"
                - properties: {experiment_mode: {const: pure}}
    E3HybridArm:
      allOf:
        - $ref: "#/components/schemas/ExperimentArmInput"
        - properties:
            arm_role: {const: hybrid}
            manifest:
              allOf:
                - $ref: "#/components/schemas/ExperimentManifest"
                - properties: {experiment_mode: {const: hybrid}}
    E4OriginalArm:
      allOf:
        - $ref: "#/components/schemas/ExperimentArmInput"
        - properties:
            arm_role: {const: original}
            manifest:
              allOf:
                - $ref: "#/components/schemas/ExperimentManifest"
                - properties: {experiment_mode: {const: original}}
    E4VariantArm:
      allOf:
        - $ref: "#/components/schemas/ExperimentArmInput"
        - properties:
            arm_role: {const: variant}
            manifest:
              allOf:
                - $ref: "#/components/schemas/ExperimentManifest"
                - properties: {experiment_mode: {const: variant}}
    E5DefenseOffArm:
      allOf:
        - $ref: "#/components/schemas/ExperimentArmInput"
        - properties:
            arm_role: {const: defense_off}
            manifest:
              allOf:
                - $ref: "#/components/schemas/ExperimentManifest"
                - properties:
                    experiment_mode: {const: defense_off}
                    defense_flag: {const: false}
    E5DefenseOnArm:
      allOf:
        - $ref: "#/components/schemas/ExperimentArmInput"
        - properties:
            arm_role: {const: defense_on}
            manifest:
              allOf:
                - $ref: "#/components/schemas/ExperimentManifest"
                - properties:
                    experiment_mode: {const: defense_on}
                    defense_flag: {const: true}
    ComparisonCreate:
      type: object
      additionalProperties: false
      required: [experiment_type, arms]
      properties:
        experiment_type: {type: string, enum: [E3, E4, E5]}
        arms:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: "#/components/schemas/ExperimentArmInput"}
      oneOf:
        - properties:
            experiment_type: {const: E3}
            arms:
              allOf:
                - contains: {$ref: "#/components/schemas/E3PureArm"}
                - contains: {$ref: "#/components/schemas/E3HybridArm"}
        - properties:
            experiment_type: {const: E4}
            arms:
              allOf:
                - contains: {$ref: "#/components/schemas/E4OriginalArm"}
                - contains: {$ref: "#/components/schemas/E4VariantArm"}
        - properties:
            experiment_type: {const: E5}
            arms:
              allOf:
                - contains: {$ref: "#/components/schemas/E5DefenseOffArm"}
                - contains: {$ref: "#/components/schemas/E5DefenseOnArm"}
      description: E3 同集 pure/hybrid；E4 original/variant 以 pair_key 配对；E5 同集且仅 defense_flag 不同。服务端校验其余配置版本一致。
    ReplayItem:
      type: object
      additionalProperties: false
      required: [replay_item_id, sample_id, trace_id, pair_key, detected, attack_success, output_validation_failed, status, error_code]
      properties:
        replay_item_id: {type: string, format: uuid}
        sample_id: {type: string, format: uuid}
        trace_id: {type: [string, "null"], format: uuid}
        pair_key: {type: string, format: uuid, description: 原始项=sample_id；变体项=origin_sample_id}
        detected: {type: [boolean, "null"]}
        attack_success: {type: [boolean, "null"]}
        output_validation_failed: {type: boolean}
        status: {type: string, enum: [succeeded, degraded, failed]}
        error_code: {type: [string, "null"], maxLength: 64}
      allOf:
        - if:
            properties: {status: {const: failed}}
          then:
            required: [error_code]
            properties:
              trace_id: {type: "null"}
              detected: {type: "null"}
              attack_success: {type: "null"}
              error_code: {type: string, minLength: 1, maxLength: 64}
          else:
            properties:
              trace_id: {type: string, format: uuid}
              detected: {type: boolean}
              attack_success: {type: [boolean, "null"]}
    ReplayRun:
      type: object
      additionalProperties: false
      required: [replay_run_id, comparison_id, arm_id, status, total_count, valid_count, detected_count, failed_count, attack_success_count, output_validation_failure_count, items, created_at, finished_at]
      properties:
        replay_run_id: {type: string, format: uuid}
        comparison_id: {type: [string, "null"], format: uuid}
        arm_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, completed, degraded, failed]}
        total_count: {type: integer, minimum: 0}
        valid_count: {type: integer, minimum: 0, description: 有真实判定结果的样本数，是检出率和 ASR 的有效分母}
        detected_count: {type: integer, minimum: 0}
        failed_count: {type: integer, minimum: 0}
        attack_success_count: {type: integer, minimum: 0}
        output_validation_failure_count: {type: integer, minimum: 0}
        items: {type: array, items: {$ref: "#/components/schemas/ReplayItem"}}
        created_at: {$ref: "#/components/schemas/DateTime"}
        finished_at: {type: [string, "null"], format: date-time}
    ExperimentArm:
      type: object
      additionalProperties: false
      required: [arm_id, arm_role, manifest, replay_run]
      properties:
        arm_id: {type: string, format: uuid}
        arm_role: {type: string, enum: [pure, hybrid, original, variant, defense_off, defense_on, single]}
        manifest: {$ref: "#/components/schemas/ExperimentManifest"}
        replay_run:
          anyOf:
            - $ref: "#/components/schemas/ReplayRun"
            - type: "null"
    ComparisonMetrics:
      type: object
      additionalProperties: false
      properties:
        recall_by_arm: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 1}}
        variant_asr: {type: [number, "null"], minimum: 0, maximum: 1}
        injection_asr_by_arm: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 1}}
        injection_asr_relative_reduction: {type: [number, "null"]}
        valid_pair_count: {type: integer, minimum: 0}
        detected_original_pair_count: {type: integer, minimum: 0}
      description: 指标由真实 replay_item 计算；失败和缺项不进入有效分母。
    Comparison:
      type: object
      additionalProperties: false
      required: [comparison_id, experiment_type, status, arms, metrics]
      properties:
        comparison_id: {type: string, format: uuid}
        experiment_type: {type: string, enum: [E3, E4, E5]}
        status: {type: string, enum: [draft, running, completed, failed]}
        arms: {type: array, minItems: 2, items: {$ref: "#/components/schemas/ExperimentArm"}}
        metrics: {$ref: "#/components/schemas/ComparisonMetrics"}
    BlindspotCell:
      type: object
      additionalProperties: false
      required: [fraud_type, attack_method, total_count, detected_count, detection_rate]
      properties:
        fraud_type: {type: string}
        attack_method: {type: string, enum: [none, character, semantic, splice, injection]}
        total_count: {type: integer, minimum: 1}
        detected_count: {type: integer, minimum: 0}
        detection_rate: {type: number, minimum: 0, maximum: 1, readOnly: true}
    RuleSuggestionCreate:
      type: object
      additionalProperties: false
      required: [sample_ids]
      properties:
        sample_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        based_on_rule_id: {type: [string, "null"], pattern: "^R[0-9]+$"}
    RuleDraft:
      type: object
      additionalProperties: false
      required: [draft_id, source_replay_run_id, source_sample_id, based_on_rule_id, proposed_rule, status, accepted_rule_id, published_rule_version_id]
      properties:
        draft_id: {type: string, format: uuid}
        source_replay_run_id: {type: [string, "null"], format: uuid}
        source_sample_id: {type: [string, "null"], format: uuid}
        based_on_rule_id: {type: [string, "null"], pattern: "^R[0-9]+$"}
        proposed_rule: {$ref: "#/components/schemas/RuleDefinition"}
        status: {type: string, enum: [pending, accepted, rejected, approved]}
        accepted_rule_id: {type: [string, "null"], pattern: "^R[0-9]+$"}
        published_rule_version_id: {type: [string, "null"], format: uuid}
      allOf:
        - if:
            properties: {status: {const: accepted}}
          then:
            properties:
              accepted_rule_id: {type: string, pattern: "^R[0-9]+$"}
              published_rule_version_id: {type: "null"}
        - if:
            properties: {status: {const: approved}}
          then:
            properties:
              accepted_rule_id: {type: string, pattern: "^R[0-9]+$"}
              published_rule_version_id: {type: string, format: uuid}
        - if:
            properties: {status: {enum: [pending, rejected]}}
          then:
            properties:
              accepted_rule_id: {type: "null"}
              published_rule_version_id: {type: "null"}
    RuleDraftReview:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [accept, reject]}
        review_note: {type: string, maxLength: 2000}
    CampaignCreate:
      type: object
      additionalProperties: false
      required: [goal, experiment_type, arms]
      properties:
        goal: {type: string, minLength: 1, maxLength: 2000}
        experiment_type: {type: string, enum: [E3, E4, E5]}
        arms:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: "#/components/schemas/ExperimentArmInput"}
      oneOf:
        - properties:
            experiment_type: {const: E3}
            arms:
              allOf:
                - contains: {$ref: "#/components/schemas/E3PureArm"}
                - contains: {$ref: "#/components/schemas/E3HybridArm"}
        - properties:
            experiment_type: {const: E4}
            arms:
              allOf:
                - contains: {$ref: "#/components/schemas/E4OriginalArm"}
                - contains: {$ref: "#/components/schemas/E4VariantArm"}
        - properties:
            experiment_type: {const: E5}
            arms:
              allOf:
                - contains: {$ref: "#/components/schemas/E5DefenseOffArm"}
                - contains: {$ref: "#/components/schemas/E5DefenseOnArm"}
      description: 活动预算由服务端配置，客户端不能通过 max_rounds/max_samples 或模型参数提高预算。
    AgentSessionCreate:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, maxLength: 128}
      description: 不接收 owner_id；匿名或登录身份由凭据决定。
    AgentSession:
      type: object
      additionalProperties: false
      required: [session_id, session_token, status, expires_at, created_at]
      properties:
        session_id: {type: string, format: uuid}
        session_token: {type: [string, "null"], minLength: 32, description: 仅匿名会话创建时返回一次}
        status: {type: string, enum: [active, expired, closed]}
        expires_at: {$ref: "#/components/schemas/DateTime"}
        created_at: {$ref: "#/components/schemas/DateTime"}
    VerificationContent:
      type: object
      additionalProperties: false
      required: [content_type, content]
      properties:
        content_type: {$ref: "#/components/schemas/ContentType"}
        content: {type: string, minLength: 1, maxLength: 100000}
      description: 显式正文由后端保存并签发 content_ref；口语候选 span 另需用户确认。
    AgentMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 20000}
        verification_content: {$ref: "#/components/schemas/VerificationContent"}
        mode: {$ref: "#/components/schemas/VerifyMode"}
    ContentConfirmation:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: {type: boolean}
      description: 不允许模型或客户端在此替换正文、类型或 span。
    CaseReference:
      type: object
      additionalProperties: false
      required: [case_id, title, advice, source_url]
      properties:
        case_id: {type: string, pattern: "^C[0-9]+$"}
        title: {type: string}
        advice: {type: string}
        source_url: {type: string, format: uri}
    AgentVerificationResult:
      type: object
      additionalProperties: false
      required: [trace_id, risk_level, total_score, degraded]
      properties:
        trace_id: {type: string, format: uuid}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        total_score: {type: number, minimum: 0, maximum: 100}
        degraded: {$ref: "#/components/schemas/DegradedList"}
    AgentMessageResponse:
      type: object
      additionalProperties: false
      required: [run_id, answer, verification_results, case_references, pending_contents, degraded]
      properties:
        run_id: {type: string, format: uuid}
        answer: {type: string, description: 模型补充说明或后端模板；风险结论由真实工具结果确定}
        verification_results: {type: array, items: {$ref: "#/components/schemas/AgentVerificationResult"}}
        case_references: {type: array, items: {$ref: "#/components/schemas/CaseReference"}}
        pending_contents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [content_ref, content_type, original_text, span_start, span_end, status]
            properties:
              content_ref: {type: string, format: uuid}
              content_type: {$ref: "#/components/schemas/ContentType"}
              original_text: {type: string}
              span_start: {type: [integer, "null"], minimum: 0}
              span_end: {type: [integer, "null"], minimum: 1}
              status: {type: string, enum: [pending, confirmed, rejected]}
        degraded: {$ref: "#/components/schemas/DegradedList"}
    Page:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {type: object}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}

    KnowledgeType:
      type: object
      additionalProperties: false
      required: [code, display_name, case_count]
      properties:
        code: {type: string}
        display_name: {type: string}
        case_count: {type: integer, minimum: 1}
    KnowledgeTypeList:
      type: array
      items: {$ref: "#/components/schemas/KnowledgeType"}
    Case:
      type: object
      additionalProperties: false
      required: [case_id, revision, fraud_type, title, content, advice, source_url, status, created_at, updated_at]
      properties:
        case_id: {type: string, pattern: "^C[0-9]+$"}
        revision: {type: integer, minimum: 1}
        fraud_type: {type: string}
        title: {type: string, minLength: 1}
        content: {type: string, minLength: 1}
        advice: {type: string, minLength: 1}
        source_url: {type: string, format: uri}
        status: {type: string, enum: [draft, published, archived]}
        created_at: {$ref: "#/components/schemas/DateTime"}
        updated_at: {$ref: "#/components/schemas/DateTime"}
    Rule:
      type: object
      additionalProperties: false
      required: [rule_id, revision, current_version_id, draft, enabled, deleted_at]
      properties:
        rule_id: {type: string, pattern: "^R[0-9]+$"}
        revision: {type: integer, minimum: 1}
        current_version_id: {type: [string, "null"], format: uuid}
        draft:
          anyOf:
            - $ref: "#/components/schemas/RuleDefinition"
            - type: "null"
        enabled: {type: boolean}
        deleted_at: {type: [string, "null"], format: date-time}
    RuleVersion:
      type: object
      additionalProperties: false
      required: [rule_version_id, rule_id, version_no, fraud_type, weight, exclusive_group, priority, conditions, explanation, enabled, created_at]
      properties:
        rule_version_id: {type: string, format: uuid}
        rule_id: {type: string, pattern: "^R[0-9]+$"}
        version_no: {type: integer, minimum: 1}
        fraud_type: {type: string}
        weight: {type: integer, minimum: 0, maximum: 100}
        exclusive_group: {type: [string, "null"]}
        priority: {type: integer}
        conditions: {type: object}
        explanation: {type: string, minLength: 1}
        enabled: {type: boolean}
        created_at: {$ref: "#/components/schemas/DateTime"}
    RuleReleaseItem:
      type: object
      additionalProperties: false
      required: [rule_id, rule_version_id, enabled]
      properties:
        rule_id: {type: string, pattern: "^R[0-9]+$"}
        rule_version_id: {type: string, format: uuid}
        enabled: {type: boolean}
    RuleRelease:
      type: object
      additionalProperties: false
      required: [version, release_id, status, items, created_at, activated_at]
      properties:
        version: {$ref: "#/components/schemas/Version"}
        release_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, active, archived]}
        items: {type: array, minItems: 1, items: {$ref: "#/components/schemas/RuleReleaseItem"}}
        created_at: {$ref: "#/components/schemas/DateTime"}
        activated_at: {type: [string, "null"], format: date-time}
    RuleConflict:
      type: object
      additionalProperties: false
      required: [conflict_id, release_version, rule_id_a, rule_id_b, conflict_type, analysis_status, details, resolution, created_at, resolved_at]
      properties:
        conflict_id: {type: string, format: uuid}
        release_version: {$ref: "#/components/schemas/Version"}
        rule_id_a: {type: string, pattern: "^R[0-9]+$"}
        rule_id_b: {type: string, pattern: "^R[0-9]+$"}
        conflict_type: {type: string, enum: [shadow, redundancy, overlap]}
        analysis_status: {type: string, enum: [confirmed, needs_review, resolved]}
        details: {type: object}
        resolution: {type: [string, "null"], enum: [fixed, accepted_risk, false_positive, null]}
        created_at: {$ref: "#/components/schemas/DateTime"}
        resolved_at: {type: [string, "null"], format: date-time}
    ListRelease:
      type: object
      additionalProperties: false
      required: [version, revision, status, entries, created_at, activated_at]
      properties:
        version: {$ref: "#/components/schemas/Version"}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, active, archived]}
        entries: {type: array, items: {$ref: "#/components/schemas/ListEntryInput"}}
        created_at: {$ref: "#/components/schemas/DateTime"}
        activated_at: {type: [string, "null"], format: date-time}
    ThresholdConfig:
      type: object
      additionalProperties: false
      required: [version, thresholds, weights, status, created_at, activated_at]
      properties:
        version: {$ref: "#/components/schemas/Version"}
        thresholds:
          type: object
          additionalProperties: false
          required: [confirm, review]
          properties:
            confirm: {type: integer, minimum: 1, maximum: 100}
            review: {type: integer, minimum: 0, maximum: 100}
        weights:
          type: object
          additionalProperties: false
          required: [rule, semantic]
          properties:
            rule: {type: number, exclusiveMinimum: 0, maximum: 1}
            semantic: {type: number, exclusiveMinimum: 0, maximum: 1}
        status: {type: string, enum: [draft, active, archived]}
        created_at: {$ref: "#/components/schemas/DateTime"}
        activated_at: {type: [string, "null"], format: date-time}
    SemanticConfig:
      type: object
      additionalProperties: false
      required: [version, enabled, layers, status, created_at, activated_at]
      properties:
        version: {$ref: "#/components/schemas/Version"}
        enabled: {type: boolean}
        layers:
          type: object
          additionalProperties: false
          properties:
            fast: {type: boolean, default: true}
            similarity: {type: boolean, default: true}
            llm: {type: boolean, default: false}
        status: {type: string, enum: [draft, active, archived]}
        created_at: {$ref: "#/components/schemas/DateTime"}
        activated_at: {type: [string, "null"], format: date-time}
    TransformDictionary:
      type: object
      additionalProperties: false
      required: [revision, entries, version, status, created_at, activated_at]
      properties:
        revision: {type: integer, minimum: 1}
        entries: {type: array, items: {$ref: "#/components/schemas/TransformEntryInput"}}
        version: {$ref: "#/components/schemas/Version"}
        status: {type: string, enum: [draft, active, archived]}
        created_at: {$ref: "#/components/schemas/DateTime"}
