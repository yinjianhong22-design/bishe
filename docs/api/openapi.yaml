openapi: 3.1.0
info:
  title: 反诈信息核验与风险解释系统 API
  version: 1.0.0
  description: |
    后续 FastAPI 业务实现的统一契约。P0/P1/P2 接口集中在此文档。
    所有耗时业务首版同步返回；超时返回真实资源 ID，不伪造完成。
    风险分、风险等级、操作键和资源所有者只能由服务端生成。
servers:
  - url: http://localhost:8000
    description: 后续业务服务；独立文档预览入口不实现这些业务路由
tags:
  - {name: Auth, description: P0 认证}
  - {name: Verification, description: P0/P1 核验、轨迹和解释}
  - {name: Knowledge, description: P0 知识库与案例运营}
  - {name: Rules, description: P0 规则草稿、版本与发布}
  - {name: Lists, description: P0 黑白名单版本}
  - {name: Configuration, description: P0 阈值、语义和变形词表}
  - {name: Feedback, description: P0 反馈与审计}
  - {name: Dashboard, description: P0 管理看板}
  - {name: Attack, description: P1 基础攻防与攻防智能体}
  - {name: Agent, description: P2 消息智能体}

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: OAuth2 密码登录
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, minLength: 1, maxLength: 64}
                password: {type: string, minLength: 1, maxLength: 256, format: password}
                grant_type: {type: string, const: password, default: password}
                scope: {type: string, default: ""}
                client_id: {type: string}
                client_secret: {type: string, format: password}
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/TokenResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/verify:
    post:
      tags: [Verification]
      operationId: verifyContent
      summary: 匿名同步单条核验
      description: fast 不调用 LLM；enhanced 增加 LLM 意图识别。trace_token 仅在创建响应中返回。
      security: []
      requestBody: {$ref: "#/components/requestBodies/VerificationRequest"}
      responses:
        "200":
          description: 核验完成，可能包含明确的降级信息
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerificationResponse"}
              example:
                code: OK
                data:
                  trace_id: 6f0579c4-2ea2-4df0-8977-9d9919ee366f
                  trace_token: example-token-000000000000000000000000
                  content_type: sms
                  mode: fast
                  fraud_type: unknown
                  total_score: 0
                  risk_level: 安全
                  rule_score: 0
                  semantic_score: 0
                  hits: []
                  explanation: 未命中风险规则，当前判定为安全；仍请通过官方渠道核实。
                  degraded: []
                  versions:
                    rule_version: rules-v1
                    rule_release_id: 6f0579c4-2ea2-4df0-8977-9d9919ee366f
                    threshold_version: thresholds-v1
                    semantic_config_version: semantic-v1
                    transform_dict_version: transforms-v1
                    list_version: lists-v1
                    retriever_version: retriever-v1
                  created_at: "2026-11-03T08:00:00Z"
                degraded: []
                trace_id: 6f0579c4-2ea2-4df0-8977-9d9919ee366f
        "400": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/verify/batch:
    post:
      tags: [Verification]
      operationId: verifyBatch
      summary: 匿名同步批量核验
      description: CSV/TXT 最大 2MB、最多 1000 条；单条失败不终止整批。完成响应和 504 details 均携带 batch_token。
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  maxLength: 2097152
                  description: CSV/TXT，解析后条目数必须为 1–1000
                mode: {$ref: "#/components/schemas/VerifyMode"}
            encoding:
              file: {contentType: text/csv}
      responses:
        "200":
          description: 本批处理结束，含逐条失败时仍按对账结果返回
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/BatchResult"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "504":
          description: 同步超时，返回可恢复查询的 batch_id 和 batch_token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchTimeoutError"}

  /api/verify/batch/{batch_id}:
    get:
      tags: [Verification]
      operationId: getBatch
      summary: 查询批量部分或最终结果
      security: [{batchToken: []}]
      parameters: [{$ref: "#/components/parameters/BatchId"}]
      responses:
        "200":
          description: 当前批量结果，不重复发放任何 capability token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/BatchDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/verify/{trace_id}:
    get:
      tags: [Verification]
      operationId: getVerificationTrace
      summary: 匿名凭 trace_token 回放轨迹
      security: [{traceToken: []}]
      parameters: [{$ref: "#/components/parameters/TraceId"}]
      responses:
        "200":
          description: 不可变判定轨迹
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/JudgmentTrace"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/verify/{trace_id}/explanation:
    post:
      tags: [Verification]
      operationId: explainVerification
      summary: P1 同步生成双视角解释
      security: [{traceToken: []}]
      parameters: [{$ref: "#/components/parameters/TraceId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [view]
              properties:
                view: {type: string, enum: [user, technical]}
      responses:
        "200":
          description: 解释完成；生成失败时回退模板并保留校验状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/ExplanationRecord"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/admin/traces/{trace_id}:
    get:
      tags: [Feedback]
      operationId: getAdminTrace
      summary: 运营读取判定轨迹
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TraceId"}]
      responses:
        "200":
          description: 反馈处理所需轨迹
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/JudgmentTrace"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/knowledge/types:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeTypes
      summary: 浏览有上线案例的分类
      security: []
      responses:
        "200": {$ref: "#/components/schemas/KnowledgeTypeListResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/knowledge/cases:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeCases
      summary: 匿名分页浏览上线案例
      security: []
      parameters:
        - {name: fraud_type, in: query, schema: {type: string, maxLength: 64}}
        - {name: keyword, in: query, schema: {type: string, maxLength: 100}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {$ref: "#/components/schemas/CasePageResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/knowledge/cases/{case_id}:
    get:
      tags: [Knowledge]
      operationId: getKnowledgeCase
      summary: 匿名读取上线案例
      security: []
      parameters: [{$ref: "#/components/parameters/CaseId"}]
      responses:
        "200": {$ref: "#/components/schemas/CaseResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/admin/knowledge/cases:
    get:
      tags: [Knowledge]
      operationId: listAdminCases
      summary: 运营浏览全部案例
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, published, archived]}}
        - {name: fraud_type, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {$ref: "#/components/schemas/CasePageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
    post:
      tags: [Knowledge]
      operationId: createCase
      summary: 运营创建案例
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/CaseRequest"}
      responses:
        "201": {$ref: "#/components/schemas/CaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/admin/knowledge/cases/{case_id}:
    patch:
      tags: [Knowledge]
      operationId: updateCase
      summary: 修订案例或上下线
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CaseId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaseUpdate"}
      responses:
        "200": {$ref: "#/components/schemas/CaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rules:
    get:
      tags: [Rules]
      operationId: listRules
      summary: 查询规则及草稿状态
      security: [{bearerAuth: []}]
      parameters:
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: fraud_type, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {$ref: "#/components/schemas/RulePageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
    post:
      tags: [Rules]
      operationId: createRule
      summary: 创建规则身份和初始草稿
      description: 不直接生效；必须继续创建不可变版本和完整 release。
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/RuleDefinition"}
      responses:
        "201": {$ref: "#/components/schemas/RuleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rules/{rule_id}:
    get:
      tags: [Rules]
      operationId: getRule
      summary: 读取规则、草稿及版本摘要
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/RuleId"}]
      responses:
        "200": {$ref: "#/components/schemas/RuleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      tags: [Rules]
      operationId: deleteRule
      summary: 软删除规则身份
      description: 不删除历史版本；生效集合的移除仍须新 release。
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/RuleId"}]
      responses:
        "200": {$ref: "#/components/schemas/RuleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rules/{rule_id}/draft:
    put:
      tags: [Rules]
      operationId: updateRuleDraft
      summary: 按 revision 修改规则草稿
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/RuleId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuleDraftUpdate"}
      responses:
        "200": {$ref: "#/components/schemas/RuleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rules/{rule_id}/versions:
    get:
      tags: [Rules]
      operationId: listRuleVersions
      summary: 查询不可变规则版本
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/RuleId"}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {$ref: "#/components/schemas/RuleVersionPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
    post:
      tags: [Rules]
      operationId: createRuleVersion
      summary: 校验草稿并冻结为不可变版本
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/RuleId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevisionRequest"}
      responses:
        "201": {$ref: "#/components/schemas/RuleVersionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rule-releases:
    get:
      tags: [Rules]
      operationId: listRuleReleases
      summary: 分页查询发布单
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, active, archived]}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {$ref: "#/components/schemas/RuleReleasePageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
    post:
      tags: [Rules]
      operationId: createRuleRelease
      summary: 创建完整规则快照并检测冲突
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuleReleaseCreate"}
      responses:
        "201": {$ref: "#/components/schemas/RuleReleaseResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rule-releases/{version}:
    get:
      tags: [Rules]
      operationId: getRuleRelease
      summary: 读取发布快照
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Version"}]
      responses:
        "200": {$ref: "#/components/schemas/RuleReleaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rule-releases/{version}/conflicts:
    get:
      tags: [Rules]
      operationId: listRuleConflicts
      summary: 查询规则冲突
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Version"}]
      responses:
        "200": {$ref: "#/components/schemas/RuleConflictPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rule-releases/{version}/conflicts/{conflict_id}/resolution:
    post:
      tags: [Rules]
      operationId: resolveRuleConflict
      summary: 记录冲突解决或人工豁免
      description: confirmed 和 needs_review 均阻断激活；豁免必须保留理由和审计。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Version"}
        - {name: conflict_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConflictResolution"}
      responses:
        "200": {$ref: "#/components/schemas/RuleConflictResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/rule-releases/{version}/activate:
    post:
      tags: [Rules]
      operationId: activateRuleRelease
      summary: 原子激活规则发布单
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Version"}]
      requestBody: {$ref: "#/components/requestBodies/ActivationRequest"}
      responses:
        "200": {$ref: "#/components/schemas/RuleReleaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/lists/active:
    get:
      tags: [Lists]
      operationId: getActiveList
      summary: 读取当前名单版本
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {$ref: "#/components/schemas/ListReleaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/lists/draft:
    get:
      tags: [Lists]
      operationId: getListDraft
      summary: 读取名单草稿
      security: [{bearerAuth: []}]
      responses:
        "200": {$ref: "#/components/schemas/ListReleaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
    put:
      tags: [Lists]
      operationId: updateListDraft
      summary: 全量替换名单草稿
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ListDraftUpdate"}
      responses:
        "200": {$ref: "#/components/schemas/ListReleaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/list-releases:
    post:
      tags: [Lists]
      operationId: createListRelease
      summary: 冻结名单草稿
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/RevisionRequest"}
      responses:
        "201": {$ref: "#/components/schemas/ListReleaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/list-releases/{version}/activate:
    post:
      tags: [Lists]
      operationId: activateListRelease
      summary: 激活名单版本
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Version"}]
      requestBody: {$ref: "#/components/requestBodies/ActivationRequest"}
      responses:
        "200": {$ref: "#/components/schemas/ListReleaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/threshold-config/active:
    get:
      tags: [Configuration]
      operationId: getActiveThresholdConfig
      summary: 读取当前阈值
      security: [{bearerAuth: []}]
      responses:
        "200": {$ref: "#/components/schemas/ThresholdConfigResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/threshold-config:
    post:
      tags: [Configuration]
      operationId: createThresholdConfig
      summary: 新建阈值版本
      description: 0 < low_min < medium_min < high_min <= 100。
      security: [{bearerAuth: []}]
      requestBody:
